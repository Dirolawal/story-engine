services:
  - type: web
    name: story-engine
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DIRO_PASSWORD
        sync: false
      - key: BASIT_PASSWORD
        sync: false
      - key: ASLI_PASSWORD
        sync: false
      - key: DEBORAH_PASSWORD
        sync: false
      - key: CHRIS_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
